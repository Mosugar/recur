name: Bug
description: Quelque chose ne fonctionne pas comme prévu dans l'app
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qui ne va pas, en une ou deux phrases.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ajouter un abonnement mensuel à 9,99 € démarré le 31/01
        2. Ouvrir son détail
        3. Constater…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plateforme
      options: [Android, iOS, Web]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Appareil et version de l'OS
      placeholder: "Pixel 7, Android 16"
  - type: dropdown
    id: build
    attributes:
      label: Comment l'app est lancée
      options: [Expo Go, APK (EAS preview), Autre]
  - type: input
    id: subscription
    attributes:
      label: Abonnement concerné (cycle, devise, date de début)
      description: Utile pour les bugs de dates, de totaux ou de rappels.
      placeholder: "hebdomadaire, EUR, 20/10/2026"
